version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11  # or openjdk8, corretto17 depending on your app
    commands:
      - echo Installing Maven...
      - apt-get update
      - apt-get install -y maven
      - mvn -version

  pre_build:
    commands:
      - echo Pre-build stage started...

  build:
    commands:
      - echo Build started on `date`
      - mvn clean install

  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - target/*.jar
    - target/*.war  # if it's a web app
  discard-paths: yes
