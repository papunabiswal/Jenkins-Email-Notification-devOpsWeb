version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11
    commands:
      - echo Installing dependencies...
      - mvn install -DskipTests=true

  pre_build:
    commands:
      - echo Running unit tests...
      - mvn test

  build:
    commands:
      - echo Packaging the Java application...
      - mvn package

  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - target/*.war
