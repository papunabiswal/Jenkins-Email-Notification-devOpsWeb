version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11  # Change as needed (e.g., corretto17, openjdk8)
    commands:
      - echo Installing Maven...
      - apt-get update
      - apt-get install -y maven
      - mvn -version

  pre_build:
    commands:
      - echo Pre-build stage started...

  build:
    commands:
      - echo Build started on `date`
      - echo Running Unit Tests...
      - mvn clean test
      - echo Running Maven Package...
      - mvn package

  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - target/*.jar
    - target/*.war  # Optional if packaging as WAR
    - target/surefire-reports/**  # JUnit test reports (optional)
  discard-paths: yes
