name: CI Build on EC2

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: [self-hosted, ec2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Build with Maven
        run: mvn clean package

      - name: Run the app
        run: mvn exec:java
